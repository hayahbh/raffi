  /* --- تحميل مكتبتك من القاعدة --- */
  function fetchAll(t){
    var all = [];
    function page(from){
      return sb.from(t).select('*').range(from, from+999).then(function(r){
        if(r.error) throw r.error;
        all = all.concat(r.data);
        return r.data.length===1000 ? page(from+1000) : all;
      });
    }
    return page(0);
  }
  function cloudLoad(){
    var T = ['books','sessions','wishlist','mood_log','goals','favorite_authors','user_settings'];
    return Promise.all(T.map(fetchAll)).then(function(res){
      var d = {}; T.forEach(function(t, i){ d[t] = res[i]; });
      function ord(list){ return list.map(fromRow).sort(function(a, b){ return (a._i==null?1e9:a._i) - (b._i==null?1e9:b._i); }).map(function(o){ delete o._i; return o; }); }
      var st = d.user_settings[0] || null;
      var extra = (st && st.extra) || {};
      Object.keys(STATE).forEach(function(k){ delete STATE[k]; });
      Object.keys(extra).forEach(function(k){ STATE[k] = extra[k]; });
      STATE.books = ord(d.books);
      STATE.favoriteBookIds = d.books.filter(function(b){ return b.is_favorite; }).map(function(b){ return b.id; });
      STATE.sessions = ord(d.sessions);
      STATE.shoppingList = ord(d.wishlist);
      STATE.moodLog = ord(d.mood_log);
      STATE.goals = d.goals.map(function(g){ var o = g.data || {}; o.id = g.id; return o; });
      STATE.favoriteAuthors = d.favorite_authors.filter(function(a){ return a.is_favorite!==false; }).map(function(a){ return a.name; });
      STATE.authorBios = {}; STATE.authorAliases = {};
      d.favorite_authors.forEach(function(a){ if(a.bio) STATE.authorBios[a.name] = a.bio; if(a.aliases && a.aliases.length) STATE.authorAliases[a.name] = a.aliases; });
      STATE.earnedBadgeIds = (st && st.earned_badge_ids) || [];
      if(st && st.current_book_id) STATE.currentBookId = st.current_book_id;
      STATE.settings = STATE.settings || {palette:'burgundy', hidden:[]};
      if(st && st.palette) STATE.settings.palette = st.palette;
      STATE.settings.hidden = (st && st.hidden) || STATE.settings.hidden || [];
      STATE.goals = STATE.goals || []; STATE.moodLog = STATE.moodLog || [];
      /* اللي جا من القاعدة يعتبر محفوظ */
      synced = {};
      var rows = buildRows();
      Object.keys(rows).forEach(function(t){
        var key = KEY_OF[t] || 'id', m = {};
        rows[t].forEach(function(r){ m[r[key]] = JSON.stringify(t==='user_settings' ? Object.assign({}, r, {updated_at:0}) : r); });
        synced[t] = m;
      });
      if(!d.user_settings.length) delete synced.user_settings;
      /* روابط الأغلفة */
      var items = STATE.books.concat(STATE.shoppingList).filter(function(x){ return x._coverPath; });
      if(!items.length) return;
      var paths = items.map(function(x){ return x._coverPath; });
      var chunks = [];
      for(var i=0;i<paths.length;i+=100) chunks.push(paths.slice(i,i+100));
      return Promise.all(chunks.map(function(c){ return sb.storage.from('covers').createSignedUrls(c, 60*60*24*30); })).then(function(rs){
        var urls = {};
        rs.forEach(function(r){ (r.data||[]).forEach(function(u){ if(u.signedUrl) urls[u.path] = u.signedUrl; }); });
        items.forEach(function(x){ if(urls[x._coverPath]){ x.cover = urls[x._coverPath]; x._coverSig = x.cover; } });
      });
    });
  }

  /* ---------- متابعة السلاسل: يدوّر على الأجزاء الجديدة في Google Books ---------- */
  var SERIES_EVERY = 7*24*60*60*1000;
  function followedSeries(){
    var map = {};
    STATE.books.forEach(function(b){
      if(!b.followSeries || !b.seriesName) return;
      var k = normalizeAr(b.seriesName);
      if(!map[k]) map[k] = {name:b.seriesName, author:b.author||'', idx:{}};
      if(b.seriesIndex) map[k].idx[b.seriesIndex] = true;
    });
    STATE.shoppingList.forEach(function(s){
      var k = s.seriesName && normalizeAr(s.seriesName);
      if(k && map[k] && s.seriesIndex) map[k].idx[s.seriesIndex] = true;
    });
    return Object.keys(map).map(function(k){ return map[k]; });
  }
  function volNumber(title, series){
    var rest = String(title).replace(series, ' ');
    var m = rest.match(/(?:vol\.?|volume|#|الجزء|ج|المجلد|book|no\.?)\s*(\d{1,3})/i) || rest.match(/(?:^|\s)(\d{1,3})(?:\s|$|:)/);
    return m ? Number(m[1]) : null;
  }
  function findNewSeriesParts(){
    var series = followedSeries();
    var known = {};
    STATE.books.concat(STATE.shoppingList).forEach(function(x){ known[normalizeAr(x.title)] = true; });
    var dismissed = (STATE.settings.seriesDismissed || []);
    var found = [];
    var chain = Promise.resolve();
    series.forEach(function(s){
      chain = chain.then(function(){
        var ar = /[\u0600-\u06FF]/, au = s.author ? s.author.split(/[،,]| و/)[0].trim() : '';
        var q = 'intitle:"' + s.name + '"' + (au && ar.test(au) === ar.test(s.name) ? ' inauthor:"' + au + '"' : '');
        return webBookSearch(q).catch(function(){ return []; }).then(function(list){
          var ns = normalizeAr(s.name), n = 0;
          list.forEach(function(b){
            var nt = normalizeAr(b.title);
            if(n >= 5 || known[nt] || nt.indexOf(ns) === -1 || dismissed.indexOf(nt) !== -1) return;
            var v = volNumber(b.title, s.name);
            if(v && s.idx[v]) return;
            known[nt] = true; n++;
            found.push({series:s.name, seriesIndex:v, book:b});
          });
        });
      });
    });
    return chain.then(function(){ return found; });
  }

  /* ---------- تكميل المعلومات الناقصة (غلاف، كاتب، دار، صفحات، نبذة) ---------- */
  var ENRICH_FIELDS = [['author','author','الكاتب'], ['publisher','publisher','الدار'], ['pages','totalPages','الصفحات'], ['synopsis','synopsis','النبذة'], ['isbn','isbn','ISBN']];
  function missingOf(x, isWish){
    var m = [];
    if(!x.cover) m.push('cover');
    ENRICH_FIELDS.forEach(function(f){
      if(f[1]==='isbn' || (isWish && (f[1]==='totalPages' || f[1]==='synopsis' || f[1]==='publisher'))) return;
      if(!x[f[1]]) m.push(f[1]);
    });
    return m;
  }
  function cleanTitle(t){
    return normalizeAr(String(t||'')).toLowerCase()
      .replace(/\([^)]*\)/g, ' ')
      .replace(/\b(vol(ume)?|issue|no|tpb|hc|the)\b\.?/g, ' ')
      .replace(/[^\u0600-\u06FFa-z0-9 ]/g, ' ').replace(/\s+/g, ' ').trim();
  }
  function titleMatch(a, b){
    var x = cleanTitle(a), y = cleanTitle(b);
    if(!x || !y) return 0;
    if(x===y) return 3;
    var nx = (x.match(/\d+/g)||[]).join(','), ny = (y.match(/\d+/g)||[]).join(',');
    var tx = x.replace(/\d+/g, ' ').split(' ').filter(Boolean), ty = y.replace(/\d+/g, ' ').split(' ').filter(Boolean);
    var short = tx.length <= ty.length ? tx : ty, long = tx.length <= ty.length ? ty : tx;
    var allIn = short.length && short.every(function(w){ return long.indexOf(w)!==-1; });
    /* لو فيه رقم جزء لازم يطابق */
    if(nx && ny && nx.split(',').pop() !== ny.split(',').pop()) return 0;
    if(allIn && (long.length - short.length) <= 2) return (nx===ny || !nx || !ny) ? 2 : 1;
    if(x.indexOf(y)!==-1 || y.indexOf(x)!==-1) return 1;
    return 0;
  }
  function searchBoth(q){
    /* Google أول، ولو ما لقى شي مطابق نضيف Open Library */
    return webBookSearch(q).catch(function(){ return []; }).then(function(g){
      return olSearch(q).catch(function(){ return []; }).then(function(o){ return g.concat(o); });
    });
  }
  function enrichOne(item){
    var p = item.isbn ? isbnLookup(item.isbn).then(function(b){ return b ? [b] : []; }) : Promise.resolve([]);
    return p.then(function(list){
      if(list.length) return list;
      return searchBoth((item.title.replace(/#/g, ' ') + ' ' + (item.author && !/[؀-ۿ]/.test(item.author) === !/[؀-ۿ]/.test(item.title) ? item.author : '')).replace(/\s+/g, ' ').trim());
    }).then(function(list){
      var best = null, score = 0;
      list.forEach(function(b){ var s = titleMatch(item.title, b.title); if(s > score){ score = s; best = b; } });
      return best ? {book:best, score:score} : null;
    }).catch(function(){ return null; });
  }

  /* ---------- تحديث الأغلفة لأعلى جودة ---------- */
  function imgSize(url){
    return new Promise(function(res){
      if(!url) return res(0);
      var im = new Image(), done = false;
      var t = setTimeout(function(){ if(!done){ done = true; res(0); } }, 15000);
      im.onload = function(){ if(done) return; done = true; clearTimeout(t); res(im.naturalWidth || 0); };
      im.onerror = function(){ if(done) return; done = true; clearTimeout(t); res(0); };
      im.src = url;
    });
  }
  function bigGoogle(url){
    if(!url || url.indexOf('books.google') === -1) return url;
    return url.replace(/&zoom=\d/, '&zoom=1').replace(/&fife=[^&]*/, '') + '&fife=w800';
  }
  function coverCandidates(item){
    var c = [];
    var isbn = String(item.isbn || '').replace(/[^0-9X]/gi, '');
    if(isbn) c.push('https://covers.openlibrary.org/b/isbn/' + isbn + '-L.jpg?default=false');
    var q = (item.title + ' ' + (item.author && /[؀-ۿ]/.test(item.author) === /[؀-ۿ]/.test(item.title) ? item.author : '')).trim();
    return searchBoth(q.replace(/#/g, ' ').replace(/\s+/g, ' ')).then(function(list){
      list.forEach(function(b){
        if(titleMatch(item.title, b.title) < 2) return;
        if(b.coverUrl){ c.push(bigGoogle(b.coverUrl)); if(b.coverUrl.indexOf('-M.jpg') !== -1) c.push(b.coverUrl.replace('-M.jpg', '-L.jpg')); }
        if(b.isbn && !isbn) c.push('https://covers.openlibrary.org/b/isbn/' + b.isbn + '-L.jpg?default=false');
      });
      return c.filter(function(u, i){ return c.indexOf(u) === i; }).slice(0, 5);
    });
  }
  function bestCoverFor(item){
    return Promise.all([imgSize(item.cover), coverCandidates(item)]).then(function(r){
      var cur = r[0], cands = r[1];
      return Promise.all(cands.map(imgSize)).then(function(sizes){
        var best = null, bw = 0;
        sizes.forEach(function(w, i){ if(w > bw){ bw = w; best = cands[i]; } });
        /* نقترح بس إذا الجديد أوضح بفرق واضح */
        if(!best || bw < 300 || bw < cur * 1.4) return null;
        return {url:best, width:bw, cur:cur};
      });
    }).catch(function(){ return null; });
  }
